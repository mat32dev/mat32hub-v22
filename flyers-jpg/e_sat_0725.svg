<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&amp;family=DM+Mono:wght@400;500&amp;display=swap');
      .wordmark { font-family: "Exo 2", sans-serif; font-weight: 700; }
      .artist   { font-family: "Exo 2", sans-serif; font-weight: 900; }
      .mono     { font-family: "DM Mono", monospace; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="#1a1611"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="600" height="8" fill="#c8462a"/>

  <!-- MAT32 wordmark -->
  <text x="40" y="68" class="wordmark" font-size="36" fill="#f1e8d8" letter-spacing="-0.5">MAT</text>
  <text x="118" y="55" class="wordmark" font-size="22" fill="#c8462a">32</text>

  <!-- Hairline separator -->
  <line x1="40" y1="90" x2="560" y2="90" stroke="#f1e8d8" stroke-width="1" opacity="0.15"/>

  <!-- Day label -->
  <text x="40" y="148" class="mono" font-size="13" fill="#c8462a" letter-spacing="4">SÁB</text>

  <!-- Date number big -->
  <text x="558" y="190" class="artist" font-size="120" fill="#f1e8d8" text-anchor="end" opacity="0.08">25</text>
  <text x="558" y="172" class="artist" font-size="80" fill="#f1e8d8" text-anchor="end" opacity="0.9">25</text>

  <!-- Month -->
  <text x="558" y="204" class="mono" font-size="13" fill="#f1e8d8" text-anchor="end" opacity="0.5" letter-spacing="4">JUL</text>

  <!-- Horizontal rule -->
  <line x1="40" y1="230" x2="560" y2="230" stroke="#c8462a" stroke-width="1.5"/>

  <!-- Artist name -->
  <text x="40" y="320" class="artist" font-size="72" fill="#f1e8d8" letter-spacing="-1">Bru Soler</text>

  <!-- Genres -->
  <text x="40" y="420" class="mono" font-size="13" fill="#c8462a" letter-spacing="3">DISCO · LEFTFIELD · BALEARIC</text>

  <!-- Divider line -->
  <line x1="40" y1="460" x2="560" y2="460" stroke="#f1e8d8" stroke-width="1" opacity="0.1"/>

  <!-- Free Entry pill -->
  <rect x="40" y="490" width="148" height="34" fill="#c8462a" rx="2"/>
  <text x="114" y="513" class="mono" font-size="11" fill="#f1e8d8" text-anchor="middle" letter-spacing="2">FREE ENTRY</text>

  <!-- Time -->
  <rect x="200" y="490" width="90" height="34" fill="none" stroke="#c8462a" stroke-width="1.5" rx="2"/>
  <text x="245" y="513" class="mono" font-size="11" fill="#f1e8d8" text-anchor="middle" letter-spacing="2">22:00</text>

  <!-- Open Decks -->
  <text x="40" y="570" class="mono" font-size="10" fill="#f1e8d8" opacity="0.35" letter-spacing="3">OPEN DECKS WARM UP</text>

  <!-- Bottom rule -->
  <line x1="40" y1="740" x2="560" y2="740" stroke="#f1e8d8" stroke-width="1" opacity="0.1"/>

  <!-- Footer -->
  <text x="40" y="774" class="mono" font-size="10" fill="#f1e8d8" opacity="0.4" letter-spacing="2">MAT32 · RUZAFA · VALENCIA</text>
  <text x="560" y="774" class="mono" font-size="10" fill="#c8462a" text-anchor="end" letter-spacing="2" opacity="0.7">MAT32.COM</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="792" width="600" height="8" fill="#c8462a"/>
</svg>