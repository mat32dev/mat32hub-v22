<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mat32 | Bar Hi-Fi, Vinilos y Eventos en Valencia</title>
    
    <!-- SEO ESTRATÉGICO -->
    <meta name="description" content="Mat32 Valencia: Santuario Hi-Fi en Ruzafa. Tienda de discos, coctelería de autor y el mejor local para colaboraciones culturales y eventos analógicos." />
    <link rel="canonical" href="https://www.mat32.com/" />
    
    <!-- PRECONNECT PARA PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- TAILWIND CONFIG -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mat: { 
                900: '#1c1917', 
                950: '#0c0a09',
                800: '#292524', 
                700: '#44403c',
                500: '#ea580c', 
                400: '#f97316', 
                cream: '#f5f5f4' 
              }
            },
            fontFamily: { 
              exo: ['"Exo 2"', 'sans-serif'], 
              sans: ['Inter', 'sans-serif'] 
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'breathing': 'breathing 3s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              breathing: {
                '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                '50%': { transform: 'scale(1.05)', opacity: '0.9' },
              }
            }
          }
        }
      }
    </script>
    
    <script>
      window.process = { env: { NODE_ENV: 'production', API_KEY: '' } };
    </script>

    <style>
      :root { color-scheme: dark; }
      body { 
        background-color: #0c0a09; 
        color: #f5f5f4; 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #44403c; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ea580c; }
      .clip-path-slant { clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.5?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
