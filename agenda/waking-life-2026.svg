    <text x="400" y="170" font-size="17" font-weight="300" fill="#f59e0b" letter-spacing="18">F  E  S  T  I  V  A  L</text>
    <text x="400" y="260" font-size="82" font-weight="300" fill="white" letter-spacing="2" font-style="italic">Waking Life</text>
