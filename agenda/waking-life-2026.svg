  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Sol minimal al fondo -->
  <circle cx="400" cy="300" r="140" fill="url(#glow)"/>
  <circle cx="400" cy="300" r="62" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.6"/>

