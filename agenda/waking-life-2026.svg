      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="55%" stop-color="#0a1d14"/>
      <stop offset="100%" stop-color="#03090a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
