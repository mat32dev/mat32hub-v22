<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#2a1a0e"/>
      <stop offset="55%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="80%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="scan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Radar rings pulsando a la izquierda -->
  <g transform="translate(250 250)">
    <circle r="40" fill="none" stroke="#ea580c" stroke-width="1.2" opacity="0.85"/>
    <circle r="80" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.6"/>
    <circle r="130" fill="none" stroke="#ea580c" stroke-width="0.8" opacity="0.4"/>
    <circle r="185" fill="none" stroke="#ea580c" stroke-width="0.7" opacity="0.25"/>
    <circle r="250" fill="none" stroke="#ea580c" stroke-width="0.6" opacity="0.15"/>

    <!-- Cruz radar -->
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#ea580c" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 6"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#ea580c" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 6"/>

    <!-- Sweep sector -->
    <path d="M 0 0 L 210 -121 A 242 242 0 0 1 242 0 Z" fill="url(#scan)" opacity="0.55"/>

    <!-- Vinilo central -->
    <g>
      <circle r="68" fill="url(#vinyl)" stroke="#1a1a1a" stroke-width="0.5"/>
      <circle r="58" fill="none" stroke="#1c1c1c" stroke-width="0.4"/>
      <circle r="48" fill="none" stroke="#1c1c1c" stroke-width="0.4"/>
      <circle r="38" fill="none" stroke="#1c1c1c" stroke-width="0.4"/>
      <circle r="24" fill="#ea580c"/>
      <circle r="24" fill="none" stroke="#080808" stroke-width="0.5"/>
      <circle r="2" fill="#000"/>
    </g>

    <!-- Blips detectados -->
    <g>
      <circle cx="115" cy="-90" r="5" fill="#22c55e"/>
      <circle cx="115" cy="-90" r="9" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
      <circle cx="-160" cy="65" r="4" fill="#22c55e"/>
      <circle cx="-95" cy="-160" r="3" fill="#22c55e" opacity="0.75"/>
      <circle cx="180" cy="120" r="3" fill="#22c55e" opacity="0.6"/>
      <circle cx="60" cy="180" r="3" fill="#22c55e" opacity="0.6"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="'Exo 2', 'Helvetica Neue', sans-serif">
    <text x="540" y="180" font-size="18" font-weight="900" fill="#ea580c" letter-spacing="7">REGISTRO · MAT32</text>
    <text x="540" y="258" font-size="60" font-weight="900" fill="white" letter-spacing="-2">Digger</text>
    <text x="540" y="314" font-size="60" font-weight="900" fill="#ea580c" letter-spacing="-2">Radar.</text>
    <line x1="540" y1="348" x2="720" y2="348" stroke="#ea580c" stroke-width="2"/>
    <text x="540" y="380" font-size="13" font-weight="300" fill="#a8a29e" letter-spacing="0.3">Escaneamos tu wantlist por ti.</text>
    <text x="540" y="420" font-family="monospace" font-size="10" font-weight="700" fill="#78716c" letter-spacing="2">DISCOGS · EBAY · WALLAPOP · TODOCOLECCION</text>
  </g>
</svg>
