<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="400" height="500" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="498" rx="23" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.3"/>

  <!-- Top accent -->
  <rect x="60" y="0" width="280" height="2" rx="1" fill="#ea580c" opacity="0.7"/>

  <!-- MAT32 wordmark -->
  <text x="200" y="56" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="32" fill="white" letter-spacing="10">MAT32</text>

  <!-- QR white background -->
  <rect x="75" y="80" width="250" height="250" rx="16" fill="#f5f5f4"/>
  <rect x="79" y="84" width="242" height="242" rx="12" fill="white"/>

  <!-- Real QR code scaled to fit -->
  <g transform="translate(83,88) scale(7.12)">
    <path stroke="#0c0a09" stroke-width="1" fill="none" d="M4 4.5h7m1 0h1m1 0h2m2 0h1m1 0h1m1 0h7M4 5.5h1m5 0h1m1 0h4m6 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h3m1 0h2m2 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m2 0h2m2 0h1m4 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h5m1 0h1m3 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m2 0h1m1 0h1m1 0h1m4 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M13 11.5h1m3 0h1m1 0h1M4 12.5h1m2 0h7m2 0h1m1 0h2m1 0h1m2 0h1m1 0h3M4 13.5h4m4 0h2m1 0h7m1 0h5M4 14.5h3m3 0h1m1 0h1m3 0h2m1 0h1m2 0h2m1 0h1m2 0h1M5 15.5h1m2 0h2m1 0h2m1 0h2m2 0h1m4 0h1m1 0h4M5 16.5h2m2 0h2m1 0h5m2 0h1m2 0h1m5 0h1M4 17.5h1m1 0h1m2 0h1m1 0h2m1 0h1m3 0h4m2 0h1m2 0h1M4 18.5h4m1 0h3m2 0h6m1 0h2m1 0h5M4 19.5h1m1 0h3m2 0h3m1 0h1m4 0h2m1 0h1m1 0h2m1 0h1M4 20.5h1m2 0h1m1 0h3m1 0h2m1 0h9m1 0h2M12 21.5h6m2 0h1m3 0h1m1 0h2M4 22.5h7m1 0h1m1 0h3m3 0h1m1 0h1m1 0h1m3 0h1M4 23.5h1m5 0h1m1 0h6m1 0h2m3 0h1m2 0h2M4 24.5h1m1 0h3m1 0h1m1 0h3m3 0h7M4 25.5h1m1 0h3m1 0h1m1 0h4m2 0h3m1 0h1m4 0h2M4 26.5h1m1 0h3m1 0h1m3 0h2m1 0h2m1 0h2m2 0h5M4 27.5h1m5 0h1m4 0h2m6 0h2m1 0h3M4 28.5h7m1 0h1m1 0h3m3 0h2m3 0h1m2 0h1"/>
  </g>

  <!-- Subtitle area -->
  <text x="200" y="365" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="300" font-size="13" fill="#a8a29e" letter-spacing="5">CARTA &amp; COCKTAILS</text>

  <!-- URL -->
  <text x="200" y="395" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="12" fill="#ea580c" letter-spacing="3">MAT32.COM/BAR</text>

  <!-- Separator -->
  <line x1="130" y1="420" x2="270" y2="420" stroke="#44403c" stroke-width="0.5"/>

  <!-- Footer -->
  <text x="200" y="448" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="8" fill="#57534e" letter-spacing="7">HI-FI LISTENING BAR</text>
  <text x="200" y="468" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="8" fill="#44403c" letter-spacing="4">RUZAFA · VALENCIA</text>

  <!-- Bottom accent -->
  <rect x="60" y="498" width="280" height="2" rx="1" fill="#ea580c" opacity="0.4"/>
</svg>
