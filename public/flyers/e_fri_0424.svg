  <line x1="0" y1="350" x2="350" y2="0" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="500" x2="500" y2="0" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="650" x2="650" y2="0" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="0" y1="800" x2="800" y2="0" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="100" y1="900" x2="900" y2="100" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="300" y1="900" x2="900" y2="300" stroke="#0f0f0f" stroke-width="1"/>
  <line x1="500" y1="900" x2="900" y2="500" stroke="#0f0f0f" stroke-width="1"/>
