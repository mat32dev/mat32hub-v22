  <text x="80" y="350" font-family="'Arial Black', Arial, sans-serif" font-size="155" font-weight="900" fill="#ffffff" letter-spacing="-8">AFRO</text>
  <text x="80" y="510" font-family="'Arial Black', Arial, sans-serif" font-size="105" font-weight="900" fill="#ea580c" letter-spacing="-4">BEAT</text>
