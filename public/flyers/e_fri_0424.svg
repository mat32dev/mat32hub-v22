  <rect x="80" y="555" width="600" height="1" fill="#222"/>
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="14" fill="#555" letter-spacing="6">HIGHLIFE · RHYTHMS · VINYL ONLY</text>
